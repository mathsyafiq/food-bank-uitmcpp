<script>
(function () {
  'use strict';

  const view = document.getElementById('view');
  const state = { data: null, tab: 'stock', photos: {} };

  // ---------- Helpers ----------

  /** Builds DOM safely: text is always set with textContent, never as HTML. */
  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    Object.keys(props || {}).forEach((key) => {
      const value = props[key];
      if (value === undefined || value === null || value === false) return;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key === 'value') node.value = value;
      else if (key === 'checked' || key === 'selected' || key === 'disabled') node[key] = true;
      else if (key.indexOf('on') === 0) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : value);
    });
    children.flat(Infinity).forEach((child) => {
      if (child === null || child === undefined || child === false) return;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    });
    return node;
  }

  function call(name, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => reject(new Error(String((err && err.message) || err).replace(/^(Exception|Error): /, ''))))
        [name](...args);
    });
  }

  let toastTimer = null;
  function toast(message, isError) {
    const box = document.getElementById('toast');
    box.textContent = message;
    box.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { box.className = ''; }, isError ? 7000 : 3500);
  }

  /** Runs an action with its button disabled, showing any error as a toast. */
  async function act(button, fn) {
    if (button) button.disabled = true;
    try {
      return await fn();
    } catch (err) {
      toast(err.message || String(err), true);
      return undefined;
    } finally {
      if (button) button.disabled = false;
    }
  }

  const pad = (n) => String(n).padStart(2, '0');
  const dayText = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => dayText(new Date());
  const daysAgo = (n) => dayText(new Date(Date.now() - n * 86400000));

  const isAdmin = () => state.data.me.role === 'admin';
  const allItems = () => state.data.items;
  const activeItems = () => state.data.items.filter((i) => i.active);
  const itemById = (id) => state.data.items.filter((i) => i.item_id === id)[0];
  const itemName = (id) => (itemById(id) || {}).name || id;
  const activeLocations = (type) => state.data.locations.filter((l) => l.active && (!type || l.type === type));
  const locName = (id) => (state.data.locations.filter((l) => l.location_id === id)[0] || {}).name || id;
  const onHand = (itemId, locationId) => state.data.stock[itemId + '|' + locationId] || 0;

  function field(label, control, hint) {
    return el('label', null, label, control, hint ? el('span', { class: 'muted' }, hint) : null);
  }

  function locationSelect(type, selected, includeAll) {
    const options = activeLocations(type).map((l) => el('option', { value: l.location_id, selected: l.location_id === selected }, l.name));
    return el('select', null, includeAll ? el('option', { value: '' }, 'All locations') : null, options);
  }

  function itemSelect(selected, includeBlank) {
    return el('select', null,
      includeBlank ? el('option', { value: '' }, includeBlank) : null,
      allItems().map((i) => el('option', { value: i.item_id, selected: i.item_id === selected }, i.name + (i.active ? '' : ' (inactive)'))));
  }

  async function reload() {
    state.data = await call('staffBootstrap');
  }

  function csvTools(result) {
    const text = el('textarea', { class: 'csv', readonly: true }, result.csv);
    const box = el('div', { hidden: true }, el('p', { class: 'muted' }, 'Select all, copy, and paste into a spreadsheet.'), text);
    const blob = new Blob(['﻿' + result.csv], { type: 'text/csv;charset=utf-8' });
    const link = el('a', { href: URL.createObjectURL(blob), download: result.filename }, 'Download ' + result.filename);
    return el('div', { class: 'card' }, link, ' · ',
      el('button', { class: 'secondary', onclick: () => { box.hidden = false; text.select(); } }, 'Download not working? Show the CSV text'),
      box);
  }

  function table(headers, rows) {
    return el('div', { class: 'table-wrap' }, el('table', null,
      el('thead', null, el('tr', null, headers.map((h) => el('th', { class: h.num ? 'num' : null }, h.label || h)))),
      el('tbody', null, rows)));
  }

  /** The "every active item with a number box" layout used by Receive, Transfer and Count. */
  function quantityTable(options) {
    const inputs = {};
    const infoCells = {};
    const rows = activeItems().map((item) => {
      inputs[item.item_id] = el('input', {
        class: 'qty', type: 'number', min: '0', step: '1', inputmode: 'numeric', 'aria-label': options.inputLabel + ': ' + item.name,
      });
      infoCells[item.item_id] = options.infoLabel ? el('td', { class: 'num muted' }) : null;
      return el('tr', null,
        el('td', null, item.name, item.unit ? el('span', { class: 'muted' }, ' · ' + item.unit) : null),
        infoCells[item.item_id],
        el('td', { class: 'num' }, inputs[item.item_id]));
    });
    const headers = ['Item'];
    if (options.infoLabel) headers.push({ label: options.infoLabel, num: true });
    headers.push({ label: options.inputLabel, num: true });
    const api = {
      node: rows.length ? table(headers, rows) : el('p', null, 'No active items yet. Add them under Items.'),
      values() {
        const out = {};
        Object.keys(inputs).forEach((id) => { out[id] = inputs[id].value.trim(); });
        return out;
      },
      filled() {
        return Object.keys(inputs).filter((id) => inputs[id].value.trim() !== '');
      },
      updateInfo(fn) {
        Object.keys(infoCells).forEach((id) => { if (infoCells[id]) infoCells[id].textContent = fn(id); });
      },
    };
    return api;
  }

  // ---------- Tabs ----------

  const TABS = [
    ['stock', 'Stock', renderStock],
    ['receive', 'Receive', renderReceive],
    ['transfer', 'Transfer', renderTransfer],
    ['count', 'Count', renderCount],
    ['adjust', 'Adjust', renderAdjust],
    ['void', 'Void visit', renderVoid],
    ['items', 'Items', renderItems],
    ['unknown', 'Unknown barcodes', renderUnknown],
    ['reports', 'Reports', renderReports],
    ['devices', 'Devices', renderDevices],
  ];
  const ADMIN_TABS = [
    ['students', 'Students', renderStudents],
    ['staff', 'Staff', renderStaff],
    ['setup', 'Setup', renderSetup],
  ];

  function renderTabs() {
    const nav = document.getElementById('tabs');
    const button = (tab) => el('button', {
      'aria-current': tab[0] === state.tab ? 'page' : null,
      onclick: () => show(tab[0]),
    }, tab[1] + (tab[0] === 'unknown' && state.data.unknown_barcodes.length ? ' (' + state.data.unknown_barcodes.length + ')' : ''));
    nav.replaceChildren(...TABS.map(button), ...(isAdmin() ? [el('span', { class: 'sep' }), ...ADMIN_TABS.map(button)] : []));
  }

  function show(tabId) {
    state.tab = tabId;
    renderTabs();
    view.replaceChildren();
    const tab = TABS.concat(ADMIN_TABS).filter((t) => t[0] === tabId)[0] || TABS[0];
    tab[2]();
    view.focus();
  }

  // ---------- Stock ----------

  function renderStock() {
    const box = el('div', null, el('p', { class: 'muted' }, 'Loading…'));
    const refresh = el('button', { class: 'secondary' }, 'Refresh');
    const csv = el('button', { class: 'secondary' }, 'Download CSV');
    const csvBox = el('div');
    async function load() {
      const report = await act(refresh, () => call('staffStockReport'));
      if (!report) return;
      if (!report.rows.length) return box.replaceChildren(el('p', null, 'No items yet. Add them under Items.'));
      box.replaceChildren(table(
        ['Item'].concat(report.locations.map((l) => ({ label: l.name, num: true }))),
        report.rows.map((r) => el('tr', null,
          el('td', null, r.name, el('div', { class: 'muted' }, r.item_id + (r.category ? ' · ' + r.category : ''))),
          r.cells.map((c) => el('td', {
            class: 'num' + (!c.stocked ? '' : c.on_hand <= 0 ? ' zero' : c.on_hand <= c.threshold ? ' low' : ''),
          }, c.stocked ? String(c.on_hand) : '–'))))));
    }
    refresh.addEventListener('click', load);
    csv.addEventListener('click', () => act(csv, async () => csvBox.replaceChildren(csvTools(await call('staffReportCsv', 'stock', {})))));
    view.append(
      el('h2', null, 'Stock on hand'),
      el('p', { class: 'muted' }, 'Amber: at or below its threshold. Red: zero or less. Stock can go negative when items leave unrecorded; a stock count fixes it. A dash means never stocked there.'),
      el('div', { class: 'actions' }, refresh, csv), csvBox, box);
    load();
  }

  // ---------- Receive, transfer, count, adjust ----------

  function renderReceive() {
    const store = (activeLocations('STORE')[0] || activeLocations()[0] || {}).location_id;
    const location = locationSelect(null, store);
    const quantities = quantityTable({ inputLabel: 'Received' });
    const donor = el('input', { maxlength: '200', placeholder: 'For example: alumni drive' });
    const date = el('input', { type: 'date', value: today() });
    const note = el('input', { maxlength: '500' });
    const save = el('button', { class: 'primary' }, 'Save delivery');
    save.addEventListener('click', () => act(save, async () => {
      const filled = quantities.filled();
      if (!filled.length) throw new Error('Enter at least one quantity.');
      if (!confirm('Record ' + filled.length + ' item(s) received into ' + locName(location.value) + '?')) return;
      const result = await call('staffReceive', {
        location_id: location.value, quantities: quantities.values(), donor_source: donor.value, delivery_date: date.value, note: note.value,
      });
      await reload();
      show('receive');
      toast('Saved ' + result.lines + ' item(s). Batch ' + result.batch_id);
    }));
    view.append(
      el('h2', null, 'Receive delivery'),
      el('div', { class: 'card' },
        el('div', { class: 'row' }, field('Into', location), field('Donor or source (optional)', donor), field('Delivery date', date)),
        field('Note (optional)', note)),
      quantities.node,
      el('p', { class: 'muted' }, 'Blank or zero rows are skipped.'),
      el('div', { class: 'actions' }, save));
  }

  function renderTransfer() {
    const from = locationSelect(null, (activeLocations('STORE')[0] || {}).location_id);
    const to = locationSelect(null, (activeLocations('PANTRY')[0] || {}).location_id);
    const quantities = quantityTable({ infoLabel: 'At source', inputLabel: 'Move' });
    const note = el('input', { maxlength: '500' });
    const update = () => quantities.updateInfo((id) => String(onHand(id, from.value)));
    from.addEventListener('change', update);
    update();
    const save = el('button', { class: 'primary' }, 'Save transfer');
    save.addEventListener('click', () => act(save, async () => {
      if (from.value === to.value) throw new Error('The from and to locations must be different.');
      const filled = quantities.filled();
      if (!filled.length) throw new Error('Enter at least one quantity.');
      if (!confirm('Move ' + filled.length + ' item(s) from ' + locName(from.value) + ' to ' + locName(to.value) + '?')) return;
      const result = await call('staffTransfer', {
        from_location_id: from.value, to_location_id: to.value, quantities: quantities.values(), note: note.value,
      });
      await reload();
      show('transfer');
      toast('Moved ' + result.items + ' item(s). Batch ' + result.batch_id);
    }));
    view.append(
      el('h2', null, 'Transfer stock'),
      el('div', { class: 'card' }, el('div', { class: 'row' }, field('From', from), field('To', to)), field('Note (optional)', note)),
      quantities.node,
      el('div', { class: 'actions' }, save));
  }

  function renderCount() {
    const location = locationSelect(null, (activeLocations('PANTRY')[0] || activeLocations()[0] || {}).location_id);
    const quantities = quantityTable({ infoLabel: 'System', inputLabel: 'Counted' });
    const note = el('input', { maxlength: '500' });
    const update = () => quantities.updateInfo((id) => String(onHand(id, location.value)));
    location.addEventListener('change', update);
    update();
    const save = el('button', { class: 'primary' }, 'Save count');
    save.addEventListener('click', () => act(save, async () => {
      const filled = quantities.filled();
      if (!filled.length) throw new Error('Enter at least one count.');
      if (!confirm('Save counts for ' + filled.length + ' item(s) at ' + locName(location.value) + '? Differences are recorded as adjustments.')) return;
      const result = await call('staffCount', { location_id: location.value, quantities: quantities.values(), note: note.value });
      await reload();
      show('count');
      toast('Count saved. ' + result.adjusted + ' item(s) adjusted.');
    }));
    view.append(
      el('h2', null, 'Stock count'),
      el('p', { class: 'notice' }, 'Sync every pantry device first (its Sync screen shows nothing waiting), so no recorded take arrives after the count. Leave an item blank if you did not count it; enter 0 if none are left.'),
      el('div', { class: 'card' }, el('div', { class: 'row' }, field('Location', location), field('Note (optional)', note))),
      quantities.node,
      el('div', { class: 'actions' }, save));
  }

  function renderAdjust() {
    const location = locationSelect(null);
    const item = itemSelect('', 'Choose an item');
    const quantity = el('input', { type: 'number', step: '1', inputmode: 'numeric', placeholder: 'e.g. -2 or 5' });
    const reason = el('select', null, ['damaged', 'expired', 'correction', 'other'].map((r) => el('option', { value: r }, r)));
    const note = el('input', { maxlength: '500' });
    const save = el('button', { class: 'primary' }, 'Save adjustment');
    save.addEventListener('click', () => act(save, async () => {
      if (!item.value) throw new Error('Choose an item.');
      if (!confirm('Change ' + itemName(item.value) + ' at ' + locName(location.value) + ' by ' + quantity.value + ' (' + reason.value + ')?')) return;
      await call('staffAdjust', { location_id: location.value, item_id: item.value, quantity: quantity.value, reason: reason.value, note: note.value });
      await reload();
      show('adjust');
      toast('Adjustment saved.');
    }));
    view.append(
      el('h2', null, 'Manual adjustment'),
      el('p', { class: 'muted' }, 'For one item: a negative number removes stock (damaged, expired), a positive number adds it (correction). For a full recount use Count.'),
      el('div', { class: 'card' },
        el('div', { class: 'row' }, field('Location', location), field('Item', item), field('Change', quantity)),
        el('div', { class: 'row' }, field('Reason', reason), field('Note (required for "other")', note)),
        el('div', { class: 'actions' }, save)));
  }

  function renderVoid() {
    const id = el('input', { placeholder: 'Visit ID from a report or the large-quantity email', autocomplete: 'off' });
    const find = el('button', { class: 'secondary' }, 'Find visit');
    const details = el('div');
    find.addEventListener('click', () => act(find, async () => {
      const visit = await call('staffFindVisit', id.value);
      const reason = el('input', { maxlength: '300', placeholder: 'Why is this visit being voided?' });
      const go = el('button', { class: 'danger', disabled: visit.voided }, visit.voided ? 'Already voided' : 'Void this visit');
      go.addEventListener('click', () => act(go, async () => {
        if (!reason.value.trim()) throw new Error('Give a reason.');
        if (!confirm('Void this visit? Its items are added back to stock. The original record stays.')) return;
        const result = await call('staffVoidVisit', { visit_id: visit.visit_id, reason: reason.value });
        await reload();
        show('void');
        toast('Visit voided: ' + result.lines + ' line(s) reversed.');
      }));
      details.replaceChildren(el('div', { class: 'card' },
        el('p', null, el('b', null, locName(visit.location_id)), ' · ', visit.occurred_at, visit.flagged ? el('span', { class: 'pill bad' }, ' large quantity ') : null),
        table(['Type', 'Item', { label: 'Qty', num: true }], visit.lines.map((l) => el('tr', null,
          el('td', null, l.type), el('td', null, l.name), el('td', { class: 'num' }, String(l.quantity))))),
        el('div', { class: 'row' }, field('Reason', reason)),
        el('div', { class: 'actions' }, go)));
    }));
    view.append(
      el('h2', null, 'Void a visit'),
      el('p', { class: 'muted' }, 'Use this when a visit was a mistake, for example a test or a wrong quantity. VOID rows reverse it; nothing is deleted.'),
      el('div', { class: 'card' }, el('div', { class: 'row' }, field('Visit ID', id)), el('div', { class: 'actions' }, find)),
      details);
  }

  // ---------- Items ----------

  async function loadPhotos(ids) {
    const missing = ids.filter((id) => {
      const item = itemById(id);
      return item && item.photo_version && (!state.photos[id] || state.photos[id].version !== item.photo_version);
    });
    if (!missing.length) return;
    const photos = await call('staffPhotos', missing);
    Object.keys(photos).forEach((id) => { state.photos[id] = photos[id]; });
  }

  function photoImg(id, cls) {
    const img = el('img', { class: cls, alt: '' });
    if (state.photos[id]) img.src = state.photos[id].data;
    return img;
  }

  function renderItems() {
    const add = el('button', { class: 'primary', onclick: () => editItem(null) }, 'Add item');
    const labels = el('button', { class: 'secondary', onclick: renderLabels }, 'Print barcode labels');
    const thumbs = {};
    const rows = allItems().map((item) => {
      const codes = state.data.barcodes.filter((b) => b.item_id === item.item_id).length;
      thumbs[item.item_id] = photoImg(item.item_id, 'thumb');
      return el('tr', null,
        el('td', null, thumbs[item.item_id]),
        el('td', null, item.name, el('div', { class: 'muted' }, item.item_id + (item.category ? ' · ' + item.category : ''))),
        el('td', { class: 'num' }, String(codes)),
        el('td', null, el('span', { class: 'pill' + (item.active ? ' ok' : '') }, item.active ? 'active' : 'inactive')),
        el('td', null, el('button', { class: 'secondary', onclick: () => editItem(item.item_id) }, 'Edit')));
    });
    view.append(
      el('h2', null, 'Items'),
      el('p', { class: 'muted' }, 'Students see active items in this order: by position number (1 first), then A–Z for items without one. Every item has an internal code (NB-…) that can be printed as a barcode label.'),
      el('div', { class: 'actions' }, add, labels),
      rows.length ? table(['', 'Item', { label: 'Barcodes', num: true }, 'Status', ''], rows) : el('p', null, 'No items yet.'));
    // Fills in this list's own thumbnails, so it is harmless if staff have already moved on to another view.
    act(null, async () => {
      await loadPhotos(Object.keys(thumbs));
      Object.keys(thumbs).forEach((id) => { if (state.photos[id]) thumbs[id].src = state.photos[id].data; });
    });
  }

  /** A drop-down from an admin-managed list. A value since removed from the list stays selectable on old items. */
  function choiceSelect(list, current) {
    const options = [el('option', { value: '' }, '(none)')];
    list.forEach((value) => options.push(el('option', { value: value, selected: value === current }, value)));
    if (current && list.indexOf(current) < 0) {
      options.push(el('option', { value: current, selected: true }, current + ' (no longer in the list)'));
    }
    return el('select', null, options);
  }

  let zxingLoading = null;

  /** The barcode library, loaded from the student app's site: the same file the student app uses on iPhones. */
  function loadZxing() {
    if (window.ZXing) return Promise.resolve(window.ZXing);
    if (!zxingLoading) {
      const base = new URL(state.data.settings.pwa_url || location.href);
      if (!base.pathname.endsWith('/')) base.pathname += '/';
      base.search = '';
      zxingLoading = new Promise((resolve, reject) => {
        const script = el('script', { src: new URL('vendor/zxing-0.21.3.min.js', base).href });
        script.onload = () => resolve(window.ZXing);
        script.onerror = () => {
          zxingLoading = null;
          reject(new Error('The barcode reader could not load. Check the connection, or type the digits instead.'));
        };
        document.head.append(script);
      });
    }
    return zxingLoading;
  }

  /** Reads an EAN, UPC or Code 128 barcode from a photo. Returns its digits, or null if none was found. */
  async function readBarcodeFromPhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      if ('BarcodeDetector' in window) { // Android Chrome has a built-in reader.
        try {
          const found = await new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] }).detect(img);
          if (found.length) return found[0].rawValue;
        } catch (err) {
          // Fall back to ZXing below.
        }
      }
      const ZX = await loadZxing();
      const hints = new Map();
      hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, [
        ZX.BarcodeFormat.EAN_13, ZX.BarcodeFormat.EAN_8, ZX.BarcodeFormat.UPC_A, ZX.BarcodeFormat.UPC_E, ZX.BarcodeFormat.CODE_128,
      ]);
      hints.set(ZX.DecodeHintType.TRY_HARDER, true);
      const reader = new ZX.MultiFormatReader();
      reader.setHints(hints);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      // Try two sizes, and the photo turned a quarter, in case the barcode was photographed on its side.
      for (const size of [1600, 1000]) {
        for (const turned of [false, true]) {
          const scale = Math.min(1, size / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.round(img.naturalWidth * scale);
          const h = Math.round(img.naturalHeight * scale);
          canvas.width = turned ? h : w;
          canvas.height = turned ? w : h;
          ctx.save();
          if (turned) {
            ctx.translate(h, 0);
            ctx.rotate(Math.PI / 2);
          }
          ctx.drawImage(img, 0, 0, w, h);
          ctx.restore();
          const rgba = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
          const luminance = new Uint8ClampedArray(canvas.width * canvas.height);
          for (let i = 0, j = 0; i < rgba.length; i += 4, j++) luminance[j] = (rgba[i] * 77 + rgba[i + 1] * 150 + rgba[i + 2] * 29) >> 8;
          try {
            const source = new ZX.RGBLuminanceSource(luminance, canvas.width, canvas.height);
            return reader.decode(new ZX.BinaryBitmap(new ZX.HybridBinarizer(source))).getText();
          } catch (err) {
            // Not found at this size or angle.
          } finally {
            reader.reset();
          }
        }
      }
      return null;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function editItem(itemId) {
    const item = itemId ? itemById(itemId) : { name: '', category: '', unit: '', sort_order: '', active: true };
    view.replaceChildren();
    const name = el('input', { value: item.name, maxlength: '80', required: true });
    const category = choiceSelect(state.data.item_categories, item.category);
    const unit = choiceSelect(state.data.item_units, item.unit);
    const sort = el('input', { type: 'number', min: '1', step: '1', placeholder: 'Blank: A–Z after numbered items', value: item.sort_order === '' ? '' : String(item.sort_order) });
    const active = el('input', { type: 'checkbox', checked: item.active });
    const save = el('button', { class: 'primary' }, itemId ? 'Save changes' : 'Add item');
    save.addEventListener('click', () => act(save, async () => {
      const result = await call('staffSaveItem', {
        item_id: itemId || '', name: name.value, category: category.value, unit: unit.value, sort_order: sort.value, active: active.checked,
      });
      await reload();
      toast(itemId ? 'Item saved.' : 'Item added as ' + result.item_id + '. Now add a photo and barcodes.');
      editItem(result.item_id);
    }));
    view.append(
      el('div', { class: 'actions' }, el('button', { class: 'secondary', onclick: () => show('items') }, '← All items')),
      el('h2', null, itemId ? item.name : 'New item'),

  /** Shrinks a photo to fit in one Sheets cell (under 48,000 characters as a data URL). */
  async function shrinkImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      for (const size of [320, 240, 180, 140]) {
        const scale = Math.min(1, size / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        for (const quality of [0.8, 0.65, 0.5]) {
          const data = canvas.toDataURL('image/jpeg', quality);
          if (data.length <= 47000) return data;
        }
      }
      throw new Error('This photo could not be made small enough. Try a simpler photo.');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

    addLoc.addEventListener('click', () => act(addLoc, async () => {
      const result = await call('adminSaveLocation', { name: newLocName.value, type: locType.value });
      await reload();
      show('setup');
      toast('Added ' + result.location_id + '.');
    }));
    const locRows = state.data.locations.map((l) => {
      const name = el('input', { value: l.name, maxlength: '60' });
      const active = el('input', { type: 'checkbox', checked: l.active });
      const save = el('button', { class: 'secondary' }, 'Save');
      save.addEventListener('click', () => act(save, async () => {
        await call('adminSaveLocation', { location_id: l.location_id, name: name.value, active: active.checked });
        await reload();
        toast('Saved.');
      }));
      return el('tr', null, el('td', null, l.location_id), el('td', null, name), el('td', null, l.type), el('td', null, active), el('td', null, save));
    });

    // Faculties
    const facCode = el('input', { maxlength: '15', placeholder: 'e.g. FSKM' });
    const facMs = el('input', { maxlength: '120', placeholder: 'Nama dalam BM' });
    const facEn = el('input', { maxlength: '120', placeholder: 'Name in English' });
    const addFac = el('button', { class: 'secondary' }, 'Save faculty');
    addFac.addEventListener('click', () => act(addFac, async () => {
      await call('adminSaveFaculty', { faculty_code: facCode.value, name_ms: facMs.value, name_en: facEn.value, active: true });
      await reload();
      show('setup');
      toast('Faculty saved.');
    }));
    const facRows = state.data.faculties.map((f) => {
      const toggle = el('button', { class: 'secondary' }, f.active ? 'Hide' : 'Show');
      toggle.addEventListener('click', () => act(toggle, async () => {
        await call('adminSaveFaculty', Object.assign({}, f, { active: !f.active }));
        await reload();
        show('setup');
      }));
      return el('tr', null, el('td', null, f.faculty_code), el('td', null, f.name_ms), el('td', null, f.name_en),
        el('td', null, f.active ? 'shown' : 'hidden'), el('td', null, toggle));
    });

    // Settings
    const inputs = {};
    const settingRows = Object.keys(SETTING_LABELS).map((key) => {
      const value = String(state.data.settings[key] === undefined ? '' : state.data.settings[key]);
      inputs[key] = key === 'student_mode'
        ? el('select', null, ['SELF', 'ROSTER'].map((m) => el('option', { value: m, selected: value === m }, m)))
        : el('input', { value: value, type: /url/.test(key) ? 'url' : /pattern|^item_/.test(key) ? 'text' : 'number' });
      return field(SETTING_LABELS[key][0], inputs[key], SETTING_LABELS[key][1]);
    });
    const saveSettings = el('button', { class: 'primary' }, 'Save settings');
    saveSettings.addEventListener('click', () => act(saveSettings, async () => {
      const values = {};
      Object.keys(inputs).forEach((k) => { values[k] = inputs[k].value; });
      await call('adminSaveSettings', values);
      await reload();
      toast('Settings saved.');
    }));

    // Maintenance
    const check = el('button', { class: 'secondary' }, 'Run stock check now');
    check.addEventListener('click', () => act(check, async () => {
      const result = await call('adminRunStockCheck');
      toast(result.mismatches ? result.mismatches + ' mismatch(es): see the email sent to admins.' : 'Stock matches the ledger.', result.mismatches > 0);
    }));
    const triggers = el('button', { class: 'secondary' }, 'Reinstall scheduled jobs');
    triggers.addEventListener('click', () => act(triggers, async () => {
      const result = await call('adminInstallTriggers');
      toast('Scheduled: ' + result.installed.join(', '));
    }));

    view.append(
      el('h2', null, 'Setup'),
      el('div', { class: 'card' }, el('h3', null, 'Locations'),
        table(['ID', 'Name', 'Type', 'Active', ''], locRows),
        el('div', { class: 'row' }, field('New location name', newLocName), field('Type', locType)), el('div', { class: 'actions' }, addLoc)),
      el('div', { class: 'card' }, el('h3', null, 'Faculties (students choose from these)'),
        table(['Code', 'BM', 'English', 'Status', ''], facRows),
        el('div', { class: 'row' }, field('Code', facCode), field('Name (BM)', facMs), field('Name (English)', facEn)),
        el('p', { class: 'muted' }, 'Saving an existing code updates it.'),
        el('div', { class: 'actions' }, addFac)),
      namelistCard(),
      el('div', { class: 'card' }, el('h3', null, 'Settings'), settingRows, el('div', { class: 'actions' }, saveSettings)),
      el('div', { class: 'card' }, el('h3', null, 'Print'),
        el('p', { class: 'muted' }, 'A QR poster for each active pantry, for students using their own phones, and barcode labels for items that have no barcode of their own.'),
        el('div', { class: 'actions' },
          el('button', { class: 'secondary', onclick: renderPosters }, 'QR posters'),
          el('button', { class: 'secondary', onclick: renderLabels }, 'Barcode labels'))),
      el('div', { class: 'card' }, el('h3', null, 'Maintenance'),
        el('p', { class: 'muted' }, 'Hourly: low-stock emails. Nightly at 2am: stock check, PDPA retention, large-quantity digest.'),
        el('div', { class: 'actions' }, check, triggers)));
  }

  // ---------- Print: QR posters and barcode labels ----------
  // A4 sheets drawn at real size. The print stylesheet hides everything else, so window.print() prints only them.

  function svgEl(tag, attrs, ...children) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs).forEach((key) => node.setAttribute(key, attrs[key]));
    node.append(...children);
    return node;
  }

  /** A QR code from the server's rows of "0" and "1", with the 4-module light margin scanners need. */
  function qrSvg(rows, label) {
    const quiet = 4;
    const n = rows.length + quiet * 2;
    let path = '';
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) if (row[x] === '1') path += 'M' + (x + quiet) + ' ' + (y + quiet) + 'h1v1h-1z';
    });
    return svgEl('svg', { viewBox: '0 0 ' + n + ' ' + n, 'shape-rendering': 'crispEdges', role: 'img', 'aria-label': label },
      svgEl('rect', { width: n, height: n, fill: '#fff' }), svgEl('path', { d: path, fill: '#000' }));
  }

  /** A Code 128 barcode from the server's bars ("1" = bar), 0.33 mm per module, with a 10-module light margin. */
  function barsSvg(bars, label) {
    const quiet = 10;
    const n = bars.length + quiet * 2;
    let path = '';
    for (let x = 0; x < bars.length; x++) {
      if (bars[x] !== '1') continue;
      let w = 1;
      while (bars[x + w] === '1') w++;
      path += 'M' + (x + quiet) + ' 0h' + w + 'v1h-' + w + 'z';
      x += w - 1;
    }
    return svgEl('svg', {
      viewBox: '0 0 ' + n + ' 1', width: (n * 0.33).toFixed(2) + 'mm', height: '12mm', preserveAspectRatio: 'none',
      'shape-rendering': 'crispEdges', role: 'img', 'aria-label': label,
    }, svgEl('rect', { width: n, height: 1, fill: '#fff' }), svgEl('path', { d: path, fill: '#000' }));
  }

  function printTools(title, hint, ...controls) {
    const print = el('button', { class: 'primary', onclick: () => window.print() }, 'Print');
    return {
      print: print,
      node: el('div', { class: 'no-print' },
        el('div', { class: 'actions' }, el('button', { class: 'secondary', onclick: () => show(state.tab) }, '← Back'), print),
        el('h2', null, title),
        el('p', { class: 'muted' }, hint, ' In the print dialog choose A4, scale 100% (Actual size), and turn off headers and footers.'),
        controls),
    };
  }

  // Student-facing text, BM first. Matches the student app (web/app.js) and its privacy notice.
  const POSTER_STEPS = [
    ['Imbas kod QR ini dengan kamera telefon anda.', 'Scan this QR code with your phone camera.'],
    ['Masukkan ID pelajar anda.', 'Enter your student ID.'],
    ['Isi nama penuh dan fakulti anda, kemudian tandakan kotak persetujuan.', 'Fill in your full name and faculty, then tick the consent box.'],
    ['Imbas kod bar atau ketik gambar setiap barang yang anda ambil.', 'Scan the barcode or tap the photo of each item you take.'],
    ['Tekan Selesai.', 'Press Done.'],
  ];
  const POSTER_PRIVACY = [
    'Privasi: Kami merekod ID pelajar, nama, fakulti dan barang yang anda ambil supaya rekod tepat dan Bahagian Hal Ehwal Pelajar (HEP) boleh menghubungi anda jika anda memerlukan bantuan lanjut. Rekod disimpan 1 tahun selepas lawatan terakhir anda dan hanya staf yang dibenarkan boleh melihatnya.',
    'Privacy: We record your student ID, name, faculty and the items you take, to keep accurate records and so Student Affairs (HEP) can contact you if you need more help. Records are kept for 1 year after your last visit and only authorised staff can see them.',
  ];

  function posterSheet(poster) {
    return el('section', { class: 'sheet poster' },
      el('header', null,
        el('p', { class: 'poster-brand' }, 'Food Bank UiTMCPP'),
        el('h1', { class: 'poster-pantry' }, poster.name),
        el('p', { class: 'poster-tag' }, 'Ambil apa yang anda perlukan', el('span', { class: 'en' }, 'Take what you need'))),
      el('div', { class: 'poster-qr' },
        qrSvg(poster.modules, 'Kod QR / QR code: ' + poster.url),
        el('p', { class: 'poster-scan' }, el('b', null, 'Imbas untuk mula'), ' · Scan to start'),
        el('p', { class: 'poster-url' }, poster.url)),
      el('ol', { class: 'poster-steps' }, POSTER_STEPS.map((step) => el('li', null, el('b', null, step[0]), el('span', { class: 'en' }, step[1])))),
      el('p', { class: 'poster-note' }, 'Tiada sambungan internet? Gunakan peranti pantri.', el('span', { class: 'en' }, 'No internet connection? Use the pantry device.')),
      el('footer', { class: 'poster-privacy' }, el('p', null, POSTER_PRIVACY[0]), el('p', null, POSTER_PRIVACY[1])));
  }

  function renderPosters() {
    const sheets = el('div', { class: 'sheets' }, el('p', { class: 'muted no-print' }, 'Loading…'));
    const pick = el('select', { 'aria-label': 'Pantry' });
    const tools = printTools('QR posters',
      'One A4 page per active pantry. Each code opens the student app for that pantry, so visits are recorded at the right place.',
      el('div', { class: 'row' }, field('Pantry', pick)));
    tools.print.disabled = true;
    view.replaceChildren(tools.node, sheets);
    act(null, async () => {
      const posters = await call('adminQrPosters');
      if (!posters.length) return sheets.replaceChildren(el('p', null, 'No active pantries. Add one under Setup, Locations.'));
      pick.replaceChildren(el('option', { value: '' }, 'All pantries (' + posters.length + ')'),
        ...posters.map((p) => el('option', { value: p.location_id }, p.name)));
      const draw = () => sheets.replaceChildren(...posters.filter((p) => !pick.value || p.location_id === pick.value).map(posterSheet));
      pick.addEventListener('change', draw);
      draw();
      tools.print.disabled = false;
    });
  }

  const LABELS_PER_PAGE = 24; // 3 across, 8 down

  function renderLabels() {
    const sheets = el('div', { class: 'sheets' });
    const picker = el('div', null, el('p', { class: 'muted' }, 'Loading…'));
    const summary = el('p', { class: 'muted' });
    const tools = printTools('Barcode labels',
      'Each label carries the item\'s internal code (NB-…) as a Code 128 barcode, which the USB scanner and phone cameras read as that item. Items with no barcode of their own are ticked. 24 labels per A4 page; cut along the dashed lines.',
      picker, summary);
    tools.print.disabled = true;
    view.replaceChildren(tools.node, sheets);
    act(null, async () => {
      const bars = await call('staffItemLabels');
      const linked = (id) => state.data.barcodes.some((b) => b.item_id === id);
      const rows = allItems().filter((item) => bars[item.item_id]).map((item) => ({
        item: item,
        tick: el('input', { type: 'checkbox', checked: item.active && !linked(item.item_id), 'aria-label': 'Print labels for ' + item.name }),
        copies: el('input', { class: 'qty', type: 'number', min: '1', max: '100', step: '1', value: '1', inputmode: 'numeric', 'aria-label': 'Labels for ' + item.name }),
      }));
      if (!rows.length) return picker.replaceChildren(el('p', null, 'No items yet. Add them under Items.'));

      function draw() {
        const labels = [];
        rows.forEach((r) => {
          if (!r.tick.checked) return;
          const copies = Math.max(1, Math.min(100, Math.floor(Number(r.copies.value)) || 1));
          for (let i = 0; i < copies; i++) labels.push(r.item);
        });
        const pages = [];
        for (let i = 0; i < labels.length; i += LABELS_PER_PAGE) pages.push(labels.slice(i, i + LABELS_PER_PAGE));
        sheets.replaceChildren(...pages.map((page) => el('section', { class: 'sheet labels' }, page.map((item) =>
          el('div', { class: 'label' },
            el('span', { class: 'label-name' }, item.name),
            barsSvg(bars[item.item_id], item.item_id),
            el('span', { class: 'label-code' }, item.item_id))))));
        summary.textContent = labels.length
          ? labels.length + ' label(s) on ' + pages.length + ' page(s).'
          : 'Tick at least one item.';
        tools.print.disabled = !labels.length;
      }
      const tickAll = (on) => () => { rows.forEach((r) => { r.tick.checked = on; }); draw(); };
      rows.forEach((r) => {
        r.tick.addEventListener('change', draw);
        r.copies.addEventListener('input', draw);
      });
      picker.replaceChildren(
        table(['', 'Item', { label: 'Own barcodes', num: true }, { label: 'Labels', num: true }], rows.map((r) => el('tr', null,
          el('td', null, r.tick),
          el('td', null, r.item.name, el('div', { class: 'muted' }, r.item.item_id + (r.item.active ? '' : ' · inactive'))),
          el('td', { class: 'num' }, String(state.data.barcodes.filter((b) => b.item_id === r.item.item_id).length)),
          el('td', { class: 'num' }, r.copies)))),
        el('div', { class: 'actions' },
          el('button', { class: 'secondary', onclick: tickAll(true) }, 'Tick all'),
          el('button', { class: 'secondary', onclick: tickAll(false) }, 'Untick all')));
      draw();
    });
  }

  // ---------- Start ----------

  document.getElementById('who').textContent = BOOT.me.email + ' · ' + BOOT.me.role;
  act(null, async () => {
    await reload();
    show('stock');
  });
})();
</script>
