<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1b1f24;
    --muted: #5b6470;
    --line: #d8dde3;
    --accent: #0b5cad;
    --accent-text: #ffffff;
    --danger: #b3261e;
    --warn-bg: #fff4d6;
    --bad-bg: #fde7e5;
    --ok-bg: #e6f4ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px 16px;
    padding: 12px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .bar h1 { margin: 0; font-size: 18px; }
  .muted { color: var(--muted); font-weight: normal; font-size: 14px; }
  nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 8px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  nav button {
    flex: none;
    border: 1px solid transparent;
    background: none;
    color: var(--accent);
    padding: 8px 12px;
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }
  nav button[aria-current="page"] { background: var(--accent); color: var(--accent-text); }
  nav .sep { flex: none; width: 1px; background: var(--line); margin: 4px 4px; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; outline: none; }
  h2 { font-size: 20px; margin: 4px 0 12px; }
  h3 { font-size: 16px; margin: 20px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .row > label { flex: 1 1 180px; }
  label { display: block; font-size: 14px; color: var(--muted); }
  label > input, label > select, label > textarea { display: block; width: 100%; margin-top: 4px; }
  input, select, textarea, button { font: inherit; }
  input, select, textarea {
    min-height: 40px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
  }
  input[type="checkbox"] { min-height: auto; width: 20px; height: 20px; vertical-align: middle; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 15px; }
  input.qty { width: 90px; text-align: right; }
  button.primary, button.secondary, button.danger {
    min-height: 40px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); }
  button.secondary { background: #fff; color: var(--accent); }
  button.danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.low { background: var(--warn-bg); }
  td.zero { background: var(--bad-bg); font-weight: 600; }
  .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; background: var(--line); display: block; }
  .photo { width: 160px; height: 160px; object-fit: cover; border-radius: 8px; background: var(--line); display: block; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 13px; background: var(--line); }
  .pill.bad { background: var(--bad-bg); color: var(--danger); }
  .pill.ok { background: var(--ok-bg); }
  .code { font: 600 32px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 4px; margin: 8px 0; }
  .notice { padding: 12px; border-radius: 6px; background: var(--warn-bg); margin: 8px 0; }
  #toast {
    position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 560px; margin: 0 auto;
    padding: 12px 16px; border-radius: 8px; background: #1b1f24; color: #fff;
    opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast.error { background: var(--danger); }
  textarea.csv { width: 100%; min-height: 200px; font: 13px ui-monospace, Menlo, monospace; }

  /* Print views: A4 sheets at real size. On screen each sheet shows its 12 mm page margin as padding. */
  @page { size: A4; margin: 12mm; }
  .sheets { overflow-x: auto; padding: 8px 0; }
  .sheet {
    width: 210mm; height: 297mm; padding: 12mm; margin: 0 auto 16px; overflow: hidden;
    background: #fff; color: #000; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
  }
  .sheet .en { display: block; color: #444; font-weight: normal; font-size: 0.8em; }
  /* Narrow screens: shrink the preview to fit. Printing always uses the real size. */
  @media screen and (max-width: 840px) { .sheet { zoom: 0.7; } }
  @media screen and (max-width: 600px) { .sheet { zoom: 0.42; } }

  .poster { display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
  .poster p { margin: 0; }
  .poster-brand { font-size: 16pt; font-weight: 600; letter-spacing: 0.04em; }
  .poster-pantry { margin: 1mm 0 2mm; font-size: 40pt; line-height: 1.1; }
  .poster-tag { font-size: 16pt; }
  .poster-qr svg { display: block; width: 88mm; height: 88mm; margin: 0 auto 2mm; }
  .poster-scan { font-size: 18pt; }
  .poster-url { margin-top: 1mm; font: 10pt ui-monospace, Menlo, monospace; word-break: break-all; color: #333; }
  .poster-steps { list-style: none; counter-reset: step; width: 100%; margin: 0; padding: 0; text-align: left; }
  .poster-steps li {
    counter-increment: step; display: grid; grid-template-columns: 10mm 1fr; column-gap: 4mm; align-items: center;
    margin: 2.5mm 0; font-size: 14pt; line-height: 1.25;
  }
  .poster-steps li::before {
    content: counter(step); grid-row: span 2; display: flex; align-items: center; justify-content: center;
    width: 10mm; height: 10mm; border: 0.6mm solid #0b5cad; border-radius: 50%; color: #0b5cad; font-weight: 700;
  }
  .poster-steps li > * { grid-column: 2; }
  .poster-note { font-size: 13pt; }
  .poster-privacy { width: 100%; padding-top: 3mm; border-top: 0.3mm solid #999; text-align: left; font-size: 8.5pt; line-height: 1.35; color: #333; }
  .poster-privacy p + p { margin-top: 1.5mm; }

  .labels {
    display: grid; grid-template-columns: repeat(3, 62mm); grid-template-rows: repeat(8, 34mm); align-content: start;
    border-top: 0.2mm dashed #999; border-left: 0.2mm dashed #999;
  }
  .label {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1mm;
    padding: 2mm 3mm; overflow: hidden; text-align: center;
    border-right: 0.2mm dashed #999; border-bottom: 0.2mm dashed #999;
  }
  .label-name {
    font-size: 10pt; font-weight: 600; line-height: 1.2; max-width: 100%; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .label svg { display: block; flex: none; }
  .label-code { font: 600 9pt ui-monospace, Menlo, monospace; letter-spacing: 0.08em; }

  @media print {
    body { background: #fff; }
    .bar, nav, #toast, .no-print { display: none !important; }
    main { max-width: none; padding: 0; }
    .sheets { overflow: visible; padding: 0; }
    /* The page margin replaces the padding. 1 mm short of the page so rounding never adds a blank page. */
    .sheet { width: auto; height: 272mm; padding: 0; margin: 0; box-shadow: none; break-after: page; }
    .sheet:last-child { break-after: auto; }
    .sheet * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
